<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Fish School | Interactive Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 3px; }
        .glass-panel {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00ffff;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffff;
        }
        .btn-glow { transition: all 0.3s ease; }
        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.8);
            border-color: rgba(0, 255, 255, 0.5);
        }
        .btn-active {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 flex flex-col justify-between p-6">
        <div class="pointer-events-auto flex justify-between items-start">
            <div>
                <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 tracking-tighter drop-shadow-[0_0_10px_rgba(0,255,255,0.5)]">
                    NEURAL SWARM
                </h1>
                <p class="text-xs text-cyan-200/60 mt-1 tracking-widest uppercase">
                    Boid Simulation // <span id="fps-counter">60</span> FPS
                </p>
            </div>
            <button id="toggle-controls" class="glass-panel text-cyan-400 px-4 py-2 rounded hover:bg-cyan-900/30 transition-colors text-sm font-bold tracking-wider border border-cyan-500/30">
                [ SETTINGS ]
            </button>
        </div>

        <div id="controls-panel" class="pointer-events-auto glass-panel absolute top-20 right-6 w-80 rounded-xl p-6 transform transition-transform duration-300 translate-x-0 text-cyan-100">
            <div class="flex justify-between items-center mb-4 border-b border-cyan-500/20 pb-2">
                <h2 class="text-sm font-bold tracking-widest text-cyan-400">PARAMETERS</h2>
                <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></div>
            </div>
            <div class="mb-6">
                <label class="text-xs text-cyan-300/70 uppercase mb-2 block">Formation Logic</label>
                <div class="grid grid-cols-2 gap-2">
                    <button class="mode-btn btn-glow glass-panel py-2 text-xs rounded border border-white/10 btn-active" data-mode="school">Free School</button>
                    <button class="mode-btn btn-glow glass-panel py-2 text-xs rounded border border-white/10" data-mode="sphere">Sphere Grid</button>
                    <button class="mode-btn btn-glow glass-panel py-2 text-xs rounded border border-white/10" data-mode="helix">Double Helix</button>
                    <button class="mode-btn btn-glow glass-panel py-2 text-xs rounded border border-white/10" data-mode="chaos">Chaos Field</button>
                </div>
            </div>
            <div class="space-y-4 mb-6">
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-cyan-300/70">SEPARATION</span>
                        <span id="val-sep" class="text-cyan-400">1.5</span>
                    </div>
                    <input type="range" min="0" max="5" step="0.1" value="1.5" class="slider-thumb" id="slider-sep">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-cyan-300/70">ALIGNMENT</span>
                        <span id="val-ali" class="text-cyan-400">1.0</span>
                    </div>
                    <input type="range" min="0" max="5" step="0.1" value="1.0" class="slider-thumb" id="slider-ali">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-cyan-300/70">COHESION</span>
                        <span id="val-coh" class="text-cyan-400">1.0</span>
                    </div>
                    <input type="range" min="0" max="5" step="0.1" value="1.0" class="slider-thumb" id="slider-coh">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-cyan-300/70">SPEED LIMIT</span>
                        <span id="val-spd" class="text-cyan-400">4.0</span>
                    </div>
                    <input type="range" min="1" max="10" step="0.5" value="4.0" class="slider-thumb" id="slider-spd">
                </div>
            </div>
            <div class="mb-4">
                <label class="text-xs text-cyan-300/70 uppercase mb-2 block">Color Mode</label>
                <select id="color-mode" class="w-full bg-black/40 border border-cyan-500/30 text-cyan-100 text-xs rounded p-2 outline-none focus:border-cyan-400">
                    <option value="rainbow">Neon Rainbow</option>
                    <option value="ocean">Deep Ocean</option>
                    <option value="fire">Thermal Vision</option>
                    <option value="matrix">Matrix Green</option>
                </select>
            </div>
            <div class="text-[10px] text-cyan-600 text-center mt-4 border-t border-cyan-900/50 pt-2">
                LMB: Attract | RMB: Repel | Scroll: Zoom
            </div>
        </div>

        <div class="pointer-events-auto flex gap-4 items-end">
            <div class="glass-panel p-3 rounded-lg">
                <div class="text-[10px] text-cyan-500 uppercase tracking-widest mb-1">Active Nodes</div>
                <div class="text-xl font-mono text-cyan-300 font-bold">1024</div>
            </div>
            <div class="glass-panel p-3 rounded-lg flex-1 max-w-md">
                <div class="text-[10px] text-cyan-500 uppercase tracking-widest mb-1">System Status</div>
                <div class="text-xs text-cyan-100 font-mono h-4 overflow-hidden relative">
                    <span id="status-text">Initializing boid vectors...</span>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container" class="absolute top-0 left-0 w-full h-full z-0 cursor-crosshair"></div>

    <script>
        const CONFIG = {
            count: 1024,
            separation: 1.5,
            alignment: 1.0,
            cohesion: 1.0,
            maxSpeed: 4.0,
            maxForce: 0.1,
            perception: 50,
            colorMode: 'rainbow',
            formation: 'school'
        };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0;
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.5;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 300;
        controls.minDistance = 20;

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0x00ffff, 1, 300);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        const geometry = new THREE.ConeGeometry(0.8, 3.5, 8);
        geometry.rotateX(Math.PI / 2);
        const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.4,
            metalness: 0.6,
            emissive: 0x000000,
            emissiveIntensity: 0.5
        });

        const mesh = new THREE.InstancedMesh(geometry, material, CONFIG.count);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(mesh);

        class Boid {
            constructor() {
                this.position = new THREE.Vector3(
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100
                );
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5),
                    (Math.random() - 0.5),
                    (Math.random() - 0.5)
                );
                this.acceleration = new THREE.Vector3();
                this.color = new THREE.Color();
                this.hueOffset = Math.random() * 0.2;
            }

            update(boids, target, repel) {
                this.flock(boids);
                
                if (CONFIG.formation !== 'school') {
                    this.seek(this.getFormationTarget(boids.indexOf(this)));
                }

                if (target) this.seek(target, 2.0);
                if (repel) this.flee(repel, 5.0);

                this.updatePhysics();
            }

            getFormationTarget(index) {
                const t = Date.now() * 0.001;
                const i = index;
                const total = CONFIG.count;
                
                if (CONFIG.formation === 'sphere') {
                    const phi = Math.acos(-1 + (2 * i) / total);
                    const theta = Math.sqrt(total * Math.PI) * phi;
                    const r = 60;
                    return new THREE.Vector3(
                        r * Math.cos(theta) * Math.sin(phi),
                        r * Math.sin(theta) * Math.sin(phi),
                        r * Math.cos(phi)
                    );
                } else if (CONFIG.formation === 'helix') {
                    const r = 40;
                    const y = (i / total) * 100 - 50;
                    const angle = i * 0.2 + t;
                    const offset = (i % 2 === 0) ? 0 : Math.PI;
                    return new THREE.Vector3(
                        r * Math.cos(angle + offset),
                        y,
                        r * Math.sin(angle + offset)
                    );
                } else if (CONFIG.formation === 'chaos') {
                    return new THREE.Vector3(
                        Math.sin(i * 0.1 + t) * 80,
                        Math.cos(i * 0.2 + t) * 80,
                        Math.sin(i * 0.05 + t * 2) * 80
                    );
                }
                return new THREE.Vector3(0,0,0);
            }

            flock(boids) {
                let sep = this.separate(boids);
                let ali = this.align(boids);
                let coh = this.cohesion(boids);

                sep.multiplyScalar(CONFIG.separation);
                ali.multiplyScalar(CONFIG.alignment);
                coh.multiplyScalar(CONFIG.cohesion);

                this.acceleration.add(sep);
                this.acceleration.add(ali);
                this.acceleration.add(coh);
            }

            seek(target, strength = 1.0) {
                let desired = new THREE.Vector3().subVectors(target, this.position);
                desired.normalize();
                desired.multiplyScalar(CONFIG.maxSpeed);
                let steer = new THREE.Vector3().subVectors(desired, this.velocity);
                steer.clampLength(0, CONFIG.maxForce * strength);
                this.acceleration.add(steer);
                return steer;
            }

            flee(target, strength = 1.0) {
                let desired = new THREE.Vector3().subVectors(this.position, target);
                let d = desired.length();
                if (d < 50) {
                    desired.normalize();
                    desired.multiplyScalar(CONFIG.maxSpeed);
                    let steer = new THREE.Vector3().subVectors(desired, this.velocity);
                    steer.clampLength(0, CONFIG.maxForce * strength);
                    this.acceleration.add(steer);
                }
            }

            updatePhysics() {
                this.velocity.add(this.acceleration);
                this.velocity.clampLength(0, CONFIG.maxSpeed);
                this.position.add(this.velocity);
                this.acceleration.multiplyScalar(0);

                const bound = 150;
                if (this.position.x < -bound) this.position.x = bound;
                if (this.position.x > bound) this.position.x = -bound;
                if (this.position.y < -bound) this.position.y = bound;
                if (this.position.y > bound) this.position.y = -bound;
                if (this.position.z < -bound) this.position.z = bound;
                if (this.position.z > bound) this.position.z = -bound;
            }

            separate(boids) {
                let steer = new THREE.Vector3();
                let count = 0;
                for (let other of boids) {
                    let d = this.position.distanceTo(other.position);
                    if ((d > 0) && (d < 20)) {
                        let diff = new THREE.Vector3().subVectors(this.position, other.position);
                        diff.normalize();
                        diff.divideScalar(d);
                        steer.add(diff);
                        count++;
                    }
                }
                if (count > 0) {
                    steer.divideScalar(count);
                }
                if (steer.length() > 0) {
                    steer.normalize();
                    steer.multiplyScalar(CONFIG.maxSpeed);
                    steer.sub(this.velocity);
                    steer.clampLength(0, CONFIG.maxForce);
                }
                return steer;
            }

            align(boids) {
                let sum = new THREE.Vector3();
                let count = 0;
                for (let other of boids) {
                    let d = this.position.distanceTo(other.position);
                    if ((d > 0) && (d < CONFIG.perception)) {
                        sum.add(other.velocity);
                        count++;
                    }
                }
                if (count > 0) {
                    sum.divideScalar(count);
                    sum.normalize();
                    sum.multiplyScalar(CONFIG.maxSpeed);
                    let steer = new THREE.Vector3().subVectors(sum, this.velocity);
                    steer.clampLength(0, CONFIG.maxForce);
                    return steer;
                }
                return new THREE.Vector3();
            }

            cohesion(boids) {
                let sum = new THREE.Vector3();
                let count = 0;
                for (let other of boids) {
                    let d = this.position.distanceTo(other.position);
                    if ((d > 0) && (d < CONFIG.perception)) {
                        sum.add(other.position);
                        count++;
                    }
                }
                if (count > 0) {
                    sum.divideScalar(count);
                    return this.seek(sum);
                }
                return new THREE.Vector3();
            }
        }

        const boids = [];
        const dummy = new THREE.Object3D();
        const _color = new THREE.Color();

        for (let i = 0; i < CONFIG.count; i++) {
            boids.push(new Boid());
        }

        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let targetPoint = null;
        let repelPoint = null;
        let isMouseDown = false;
        let isRightMouseDown = false;

        window.addEventListener('resize', onWindowResize, false);
        document.addEventListener('mousemove', onMouseMove, false);
        document.addEventListener('mousedown', (e) => {
            if(e.target.closest('#controls-panel') || e.target.closest('#toggle-controls')) return;
            if (e.button === 0) isMouseDown = true;
            if (e.button === 2) isRightMouseDown = true;
        });
        document.addEventListener('mouseup', () => { isMouseDown = false; isRightMouseDown = false; });
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.getElementById('toggle-controls').addEventListener('click', () => {
            const panel = document.getElementById('controls-panel');
            panel.classList.toggle('translate-x-full');
            panel.classList.toggle('opacity-0');
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('btn-active'));
                e.target.classList.add('btn-active');
                CONFIG.formation = e.target.dataset.mode;
                updateStatus(`Formation switched to: ${CONFIG.formation.toUpperCase()}`);
            });
        });

        ['sep', 'ali', 'coh', 'spd'].forEach(key => {
            const slider = document.getElementById(`slider-${key}`);
            const display = document.getElementById(`val-${key}`);
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                display.innerText = val.toFixed(1);
                if (key === 'sep') CONFIG.separation = val;
                if (key === 'ali') CONFIG.alignment = val;
                if (key === 'coh') CONFIG.cohesion = val;
                if (key === 'spd') CONFIG.maxSpeed = val;
            });
        });

        document.getElementById('color-mode').addEventListener('change', (e) => {
            CONFIG.colorMode = e.target.value;
            updateStatus(`Color mode: ${e.target.options[e.target.selectedIndex].text}`);
        });

        // PERBAIKAN: Variabel untuk tracking status
        let currentStatus = "System Online";
        let statusTimer = null;

        function updateStatus(msg) {
            currentStatus = msg;
            const el = document.getElementById('status-text');
            
            // Fade out
            el.style.transition = "opacity 0.2s";
            el.style.opacity = 0;
            
            setTimeout(() => {
                el.innerText = msg;
                el.style.opacity = 1;
            }, 200);

            // Reset ke status default setelah 3 detik
            if (statusTimer) clearTimeout(statusTimer);
            statusTimer = setTimeout(() => {
                currentStatus = "System Online - Tracking " + CONFIG.count + " nodes";
                el.style.opacity = 0;
                setTimeout(() => {
                    el.innerText = currentStatus;
                    el.style.opacity = 1;
                }, 200);
            }, 3000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const target = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, target);
            
            if (isMouseDown) targetPoint = target;
            else targetPoint = null;

            if (isRightMouseDown) repelPoint = target;
            else repelPoint = null;
            
            if(target) pointLight.position.copy(target);
        }

        const clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = 0;
        let frameCounter = 0;

        // PERBAIKAN: Update status awal setelah 1 detik
        setTimeout(() => {
            updateStatus("System Online - Tracking " + CONFIG.count + " nodes");
        }, 1000);

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // FPS Counter
            frameCount++;
            if (time - lastTime >= 1) {
                document.getElementById('fps-counter').innerText = frameCount;
                frameCount = 0;
                lastTime = time;
            }

            // PERBAIKAN: Update status dinamis setiap 60 frame
            frameCounter++;
            if (frameCounter % 60 === 0) {
                const statusEl = document.getElementById('status-text');
                if (targetPoint) {
                    statusEl.innerText = "Attracting nodes to cursor...";
                } else if (repelPoint) {
                    statusEl.innerText = "Repelling nodes from cursor...";
                } else if (currentStatus === "System Online - Tracking " + CONFIG.count + " nodes") {
                    statusEl.innerText = currentStatus;
                }
            }

            for (let i = 0; i < CONFIG.count; i++) {
                const boid = boids[i];
                boid.update(boids, targetPoint, repelPoint);

                dummy.position.copy(boid.position);
                
                const lookTarget = boid.position.clone().add(boid.velocity);
                dummy.lookAt(lookTarget);
                
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);

                let r, g, b;
                const speedRatio = boid.velocity.length() / CONFIG.maxSpeed;
                
                if (CONFIG.colorMode === 'rainbow') {
                    const hue = (time * 0.1 + boid.position.x * 0.01 + boid.hueOffset) % 1;
                    _color.setHSL(hue, 0.8, 0.5);
                } else if (CONFIG.colorMode === 'ocean') {
                    _color.setHSL(0.6, 0.8, 0.2 + speedRatio * 0.4);
                } else if (CONFIG.colorMode === 'fire') {
                    _color.setHSL(0.05 + speedRatio * 0.1, 1.0, 0.5);
                } else if (CONFIG.colorMode === 'matrix') {
                    _color.setHSL(0.3, 1.0, 0.2 + Math.random() * 0.2);
                }
                
                mesh.setColorAt(i, _color);
            }

            mesh.instanceMatrix.needsUpdate = true;
            mesh.instanceColor.needsUpdate = true;

            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
